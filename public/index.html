<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeChat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <div class="header">
            <h1>FreeChat</h1>
            <p>Chat • Audio Call • Video Call</p>
        </div>

        <!-- Welcome Screen -->
        <div class="welcome" id="welcomeScreen">

            <div class="logo">💬</div>

            <h2>Welcome to FreeChat</h2>

            <p>
                Connect with your friends through messages,
                audio calls and video calls.
            </p>

            <input
                type="text"
                id="username"
                placeholder="Enter your name"
                maxlength="30"
            >

            <button id="startBtn">Get Started</button>

        </div>

        <!-- Chat Screen -->
        <div class="chat" id="chatScreen" style="display: none;">

            <div class="chat-header">
                <h2>FreeChat 💬</h2>
                <span id="onlineStatus">Connecting...</span>
            </div>

            <div class="messages" id="messages"></div>

            <div class="message-box">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type a message..."
                    maxlength="500"
                >

                <button id="sendBtn">Send</button>

            </div>

        </div>

    </div>

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Our JavaScript -->
    <script src="app.js"></script>

</body>
</html>
